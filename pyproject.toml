[project]
name = "joystick-inversion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jack Smith", email = "jacksmith2000@me.com" }
]
requires-python = ">=3.11"
dependencies = [
    "cmasher>=1.9.2",
    "einops>=0.8.2",
    "exponax>=0.2.0",
    "jax>=0.10.2",
    "magnumnp>=2.2.0",
    "magpylib>=5.2.2",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "pandas-stubs>=3.0.0.260204",
    "scikit-learn>=1.8.0",
    "scikit-learn-stubs>=0.0.3",
    "torch>=2.13.0",
    "tqdm>=4.70.1",
    "vape4d>=0.2.7",
]


[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "ruff>=0.15.2",
    "ty>=0.0.18",
]

[tool.ruff.lint]
ignore = ["E731", "F541"]

[tool.ty.rules]
unused-type-ignore-comment = "ignore"
